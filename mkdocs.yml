site_name: repopath
site_description: pathlib-style, read-only paths for the repository trees of GitHub, GitLab and Gitea
site_url: https://jose-pr.github.io/repopath/
repo_url: https://github.com/jose-pr/repopath
repo_name: jose-pr/repopath
edit_uri: edit/main/docs/

# Constrain the scan to docs/ so pymdownx.snippets + strict nav don't trip on
# repo-level markdown.
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - content.code.copy

nav:
  - Home: index.md
  - Guides:
      - Repository paths: guides/paths.md
      - The repo, github, gitlab, gitea, svn+https, svn+http and sourceforge schemes: guides/uri.md
  - Benchmarks: benchmarks.md
  - Divergences from pathlib: divergences.md
  - API Reference:
      - Paths and backends: api/paths.md
      - The schemes: api/uri.md
      - Exceptions: api/exceptions.md
  - Changelog: changelog.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            merge_init_into_class: true
            show_if_no_docstring: true

markdown_extensions:
  - admonition
  - tables
  - pymdownx.snippets:
      base_path: ["."]
  - pymdownx.superfences
