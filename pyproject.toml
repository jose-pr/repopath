[build-system]
# PEP 639 `license`/`license-files` below need hatchling 1.27 or newer.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "repopath"
version = "0.1.0"
authors = [{ name = "Jose A" }]
description = "pathlib-style, read-only paths for the repository trees of GitHub and GitLab, and the repo:, github: and gitlab: schemes for uripath"
readme = "README.md"
requires-python = ">=3.9"
# PEP 639: SPDX license expression plus the file it refers to. This replaces
# the legacy `License ::` classifier; do not list one alongside it.
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    # src/repopath/py.typed ships in the wheel.
    "Typing :: Typed",
]
dependencies = [
    "pathapi>=0.1.0,<0.2",
]

[project.optional-dependencies]
# The repo:, github: and gitlab: schemes of uripath. `import repopath` never
# imports uripath.
uri = ["pathapi-uri>=0.1.0,<0.2"]
all = ["repopath[uri]"]
dev = [
    'build',
    'twine',
    'hatchling',
    'pytest',
    'pytest-cov',
    'black',
]
docs = ['mkdocs', 'mkdocs-material', 'mkdocstrings[python]']

# Declared whether or not uripath is installed: nothing reads the group
# without it, and a class is imported only when a path of its scheme is built.
[project.entry-points."uripath.schemes"]
repo = "repopath.uri:RepoURIPath"
github = "repopath.uri:GitHubURIPath"
gitlab = "repopath.uri:GitLabURIPath"

[project.urls]
Homepage = "https://github.com/jose-pr/repopath/"
Documentation = "https://jose-pr.github.io/repopath/"
Issues = "https://github.com/jose-pr/repopath/issues"

# Ship the consumer-facing docs inside the installed package, so they are
# readable from site-packages via importlib.resources without the repo.
# src/repopath/AGENTS.md (the API header) is included automatically by living
# in the package dir. The repo-root AGENTS.md is contributor orientation for a
# checkout and is not part of the wheel.
[tool.hatch.build.targets.wheel.force-include]
"README.md" = "repopath/README.md"

# `*.local.*` files are per-machine overrides and `CLAUDE*` is agent config:
# neither is ever packaged (both are also gitignored). `/.*` does not match
# them, since their names do not start with a dot.
[tool.hatch.build.targets.sdist]
exclude = ["/.*", "/AGENTS.md", "/benchmarks", "*.local.*", "CLAUDE*"]

[tool.hatch.build.targets.wheel]
packages = ["src/repopath"]
exclude = ["*.local.*", "CLAUDE*"]

[tool.black]
# Pinned to the project's *minimum* supported Python so black never emits
# syntax the 3.9 floor cannot parse.
target-version = ["py39"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
    "error",
]
xfail_strict = true
